name: HYROX Anaheim availability

on:
  workflow_dispatch:
  schedule:
    # Both PDT and PST UTC windows. The script's Pacific-time guard removes
    # the extra DST-overlap invocations.
    - cron: "5 7-9,14-20 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: hyrox-anaheim-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -q

      - name: Check availability
        id: monitor
        run: >-
          python monitor.py
          ${{ github.event_name == 'schedule' && '--schedule-guard' || '' }}

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hyrox-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record check status
        if: always()
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          outcome = os.environ.get("MONITOR_OUTCOME", "skipped")
          payload = {
              "status": "success" if outcome == "success" else "failure",
              "monitor_outcome": outcome,
              "recorded_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "run_url": os.environ["RUN_URL"],
          }
          path = Path("state/run-status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Render GitHub notification
        if: >-
          steps.monitor.outputs.changed == 'true' ||
          steps.monitor.outputs.block_summary_due == 'true'
        env:
          HYROX_CHANGES: ${{ steps.monitor.outputs.changes }}
          HYROX_NOTIFY_USERS: ${{ vars.HYROX_NOTIFY_USERS }}
        run: python notify.py

      - name: Post GitHub notification
        if: >-
          steps.monitor.outputs.changed == 'true' ||
          steps.monitor.outputs.block_summary_due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(gh issue list --state open --search 'HYROX Anaheim ticket monitor in:title' --json number,title --jq '.[] | select(.title == "HYROX Anaheim ticket monitor") | .number' | head -1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file notification.md
          else
            gh issue create --title "HYROX Anaheim ticket monitor" --body-file notification.md
          fi

      # Notify first: if issue delivery ever fails, the old state remains and
      # the next scheduled run retries the alert instead of silently losing it.
      - name: Persist rolling state
        if: always()
        run: |
          if git diff --quiet -- state/current.json state/run-status.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/current.json state/run-status.json
          git commit -m "chore: update ticket monitor state [skip ci]"
          git push

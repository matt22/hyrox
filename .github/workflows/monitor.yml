name: HYROX ticket availability

# No `schedule:` trigger. GitHub's cron cannot hold to eight runs a day: it
# delivers slots late and unpredictably, so covering every run hour means
# asking for far more arrivals than needed and turning most away — runs on the
# Actions log either way. The Cloudflare Worker in cloudflare/ dispatches this
# workflow once per run hour instead, and schedule.py enforces that ceiling
# per event independently of whatever does the dispatching.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Check now even if this hour is already recorded
        type: boolean
        default: false
      event:
        description: Event key from config/events.json (blank = every active event)
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: hyrox-monitor
  cancel-in-progress: false

jobs:
  # Runs before any install so a slot we are going to skip costs seconds.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      events: ${{ steps.guard.outputs.events }}
    env:
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Which events' checks are due this hour?
        id: guard
        env:
          EVENT: ${{ inputs.event }}
        run: |
          # pipefail so a broken guard fails loudly instead of leaving `events`
          # unset, which would silently skip every check from then on.
          set -o pipefail
          python3 schedule.py ${{ inputs.force && '--force' || '' }} ${EVENT:+--event "$EVENT"} | tee -a "$GITHUB_OUTPUT"

      # A broken guard still spends the hour for every active event, and shows
      # on the dashboard as a failed check.
      - name: Record guard failure
        if: failure() && steps.guard.outcome == 'failure'
        run: |
          python3 record_run.py --all-active --outcome failure
          .github/persist-state.sh state/*/run-status.json

  check:
    needs: plan
    if: needs.plan.outputs.events != '' && needs.plan.outputs.events != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # One event at a time: each job commits and pushes its own state.
      max-parallel: 1
      matrix:
        event: ${{ fromJSON(needs.plan.outputs.events) }}
    env:
      PYTHONUNBUFFERED: "1"
      EVENT: ${{ matrix.event }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: playwright install --with-deps chromium

      - name: Check availability
        id: monitor
        run: python monitor.py --event "$EVENT"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hyrox-diagnostics-${{ github.run_id }}-${{ matrix.event }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record check status
        if: always()
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 record_run.py --event "$EVENT"

      - name: Render GitHub notification
        if: >-
          steps.monitor.outputs.changed == 'true' ||
          steps.monitor.outputs.block_summary_due == 'true'
        env:
          HYROX_STATE_PATH: ${{ steps.monitor.outputs.snapshot }}
          HYROX_CHANGES: ${{ steps.monitor.outputs.changes }}
          HYROX_NOTIFY_USERS: ${{ vars.HYROX_NOTIFY_USERS }}
        run: python notify.py

      # One persistent issue per event; matched with or without the leading
      # icon, which the Anaheim issue gained after it was created.
      - name: Post GitHub notification
        if: >-
          steps.monitor.outputs.changed == 'true' ||
          steps.monitor.outputs.block_summary_due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.monitor.outputs.issue_title }}
        run: |
          export PLAIN_TITLE="${TITLE#🟢 }"
          issue_number="$(gh issue list --state open --search "$PLAIN_TITLE in:title" --json number,title --jq '.[] | select(.title == env.TITLE or .title == env.PLAIN_TITLE) | .number' | head -1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --title "$TITLE"
            gh issue comment "$issue_number" --body-file notification.md
          else
            gh issue create --title "$TITLE" --body-file notification.md
          fi

      # Notify first: if issue delivery ever fails, the old state remains and
      # the next scheduled run retries the alert instead of silently losing it.
      - name: Persist rolling state
        if: always()
        run: .github/persist-state.sh "state/$EVENT"

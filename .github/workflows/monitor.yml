name: HYROX Anaheim availability

# No `schedule:` trigger. GitHub's cron cannot hold to eight runs a day: it
# delivers slots late and unpredictably, so covering every Pacific hour means
# asking for far more arrivals than needed and turning most away — runs on the
# Actions log either way. The Cloudflare Worker in cloudflare/ dispatches this
# workflow once per Pacific run hour instead, and schedule.py enforces that
# ceiling independently of whatever does the dispatching.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Check now even if this Pacific hour is already recorded
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: hyrox-anaheim-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      # Runs before any install so a slot we are going to skip costs seconds.
      - name: Is this hour's check due?
        id: guard
        run: |
          # pipefail so a broken guard fails loudly instead of leaving `due`
          # unset, which would silently skip every check from then on.
          set -o pipefail
          python3 schedule.py ${{ inputs.force && '--force' || '' }} | tee -a "$GITHUB_OUTPUT"

      - if: steps.guard.outputs.due == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.guard.outputs.due == 'true'
        run: pip install -r requirements.txt
      - if: steps.guard.outputs.due == 'true'
        run: pytest -q
      - if: steps.guard.outputs.due == 'true'
        run: playwright install --with-deps chromium

      - name: Check availability
        id: monitor
        if: steps.guard.outputs.due == 'true'
        run: python monitor.py

      - name: Upload diagnostics
        if: failure() && steps.guard.outputs.due == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: hyrox-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record check status
        if: always() && (steps.guard.outputs.due == 'true' || steps.guard.outcome == 'failure')
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          outcome = os.environ.get("MONITOR_OUTCOME", "skipped")
          attempt = {
              "status": "success" if outcome == "success" else "failure",
              "monitor_outcome": outcome,
              "recorded_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "run_url": os.environ["RUN_URL"],
          }
          path = Path("state/run-status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          previous = json.loads(path.read_text()) if path.exists() else None
          if previous and "history" in previous:
              history = previous["history"]
          elif previous and previous.get("run_id"):
              history = [previous]
          else:
              history = []
          history = [
              item for item in history
              if (item.get("run_id"), item.get("run_attempt"))
              != (attempt["run_id"], attempt["run_attempt"])
          ]
          history.append(attempt)
          # Only due slots are recorded, so this tracks the dashboard window plus
          # a spare day of failure markers. Deliberately not imported from
          # schedule.py: this step must still log when the guard failed because
          # schedule.py itself is broken. A test keeps the two in step.
          limit = 24  # CHECKS_PER_DAY * (HISTORY_DAYS + 1)
          history = history[-limit:]
          payload = {
              "meta": {"max_attempts": limit, "attempt_count": len(history)},
              "history": history,
          }
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Render GitHub notification
        if: >-
          steps.monitor.outputs.changed == 'true' ||
          steps.monitor.outputs.block_summary_due == 'true'
        env:
          HYROX_CHANGES: ${{ steps.monitor.outputs.changes }}
          HYROX_NOTIFY_USERS: ${{ vars.HYROX_NOTIFY_USERS }}
        run: python notify.py

      - name: Post GitHub notification
        if: >-
          steps.monitor.outputs.changed == 'true' ||
          steps.monitor.outputs.block_summary_due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(gh issue list --state open --search 'HYROX Anaheim ticket monitor in:title' --json number,title --jq '.[] | select(.title == "🟢 HYROX Anaheim ticket monitor" or .title == "HYROX Anaheim ticket monitor") | .number' | head -1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --title "🟢 HYROX Anaheim ticket monitor"
            gh issue comment "$issue_number" --body-file notification.md
          else
            gh issue create --title "🟢 HYROX Anaheim ticket monitor" --body-file notification.md
          fi

      # Notify first: if issue delivery ever fails, the old state remains and
      # the next scheduled run retries the alert instead of silently losing it.
      - name: Persist rolling state
        if: always() && (steps.guard.outputs.due == 'true' || steps.guard.outcome == 'failure')
        run: |
          if git diff --quiet -- state/current.json state/run-status.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/current.json state/run-status.json
          git commit -m "chore: update ticket monitor state [skip ci]"
          # Another push can land while Playwright is driving the ticket shop.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

name = "hyrox-monitor-trigger"
main = "worker.js"
compatibility_date = "2026-09-13"

# Every ten minutes: 144 invocations a day against a 100,000/day free-plan
# allowance, and one of five free cron triggers. Only ticks inside a Pacific run
# hour spend a subrequest, and an hour is dispatched only if it has neither an
# observation nor a logged attempt — so GitHub runs this at most eight times a
# day. Ticking well above eight is deliberate: Cloudflare does not retry a tick
# it drops, and nothing else triggers the workflow.
[triggers]
crons = ["*/10 * * * *"]
